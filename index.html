<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quadern de Watts</title>
<meta name="description" content="El pla d'hivern de l'Albert, connectat amb Strava.">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Watts">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preload" as="image" href="media/mud.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="app.css?v=1.8.0">
</head>
<body>
<header class="hero" id="hero">
  <img class="heroimg" id="heroimg" src="media/mud.webp" alt="L'Albert i un company rodant per un camí enfangat">
  <div class="shade"></div>
  <div class="top g"><div class="col" style="width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px">
    <span class="brand">Quadern de Watts</span>
    <label class="pill" for="ftp">FTP <input id="ftp" type="number" inputmode="numeric" min="100" max="500" value="245"> W</label>
  </div></div>
  <div class="bottom g"><div class="col" style="width:100%;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <span class="kick" id="heroKick">Avui</span>
      <h1 id="heroTitle">Carregant…</h1>
      <span class="sub" id="heroSub" hidden></span>
    </div>
    <div id="heroVerdict" hidden></div>
    <div class="tiles" id="heroTiles"></div>
    <div class="glass">
      <div class="wkbar"><button type="button" id="wkPrev" aria-label="Setmana anterior">‹</button><span class="nm" id="wkName">Setmana</span><span class="ld" id="wkLoad"></span><button type="button" id="wkNext" aria-label="Setmana següent">›</button></div>
      <div class="strip" id="strip"></div>
      <div class="legend2"><span><i class="lp"></i>Previst</span><span><i class="la"></i>Fet · alçada = càrrega, color = intensitat real</span></div>
    </div>
  </div></div>
</header>

<main class="g">
  <div class="col stack" style="gap:22px">
    <div class="status" id="status"><span class="dot"></span><span class="msg" id="statusMsg">Carregant el pla…</span><button class="btn ghost" id="refresh" type="button">Actualitza</button></div>
    <section class="card" id="setup" hidden></section>
    <section class="card decide" id="decide" hidden></section>
    <section id="sel" aria-label="Sessió seleccionada"></section>
    <section class="card" id="wahoo" aria-label="Wahoo"></section>
    <section class="card progress" id="progress"></section>
    <div class="actions"><button class="btn primary" id="share" type="button">Envia el resum a Claude</button></div>
    <details class="box" id="logBox"><summary>Canvis al pla</summary><ul class="log" id="log"></ul></details>
    <details class="box"><summary>Zones de potència</summary>
      <div class="tbl" style="margin-top:10px"><table class="zt"><thead><tr><th>Zona</th><th>% FTP</th><th>Watts</th></tr></thead><tbody id="zones"></tbody></table></div>
    </details>
    <details class="box" id="connBox"><summary>Connexió amb Strava</summary><div class="conn" id="conn"></div></details>
    <p class="note">L'app mira Strava cada 5 minuts mentre està oberta i cada cop que hi tornes. <span id="ver"></span></p>
  </div>
</main>
<div class="toast" id="toast" hidden><div id="toastMsg"></div></div>
<script src="app.js?v=1.8.0"></script>
</body>
</html>
